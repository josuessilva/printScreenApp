plugins {
    id 'com.android.application'
}

android {
    namespace 'com.printdelay.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.printdelay.app'
        minSdk 30          // takeScreenshot() do serviço de acessibilidade exige Android 11+
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependências externas: usa só o framework do Android.
